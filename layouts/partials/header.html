<nav class="navbar navbar-expand-lg site-navigation {{ if .Site.Params.nav_bar_dark }}navbar-dark{{ end }}">
  <div class="container">
    <a class="navbar-brand" href="{{ .Site.BaseURL | relURL }}">
      <img src="{{ .Site.Params.logo | relURL }}" alt="logo" />
    </a>
    <button class="navbar-toggler collapsed" type="button" data-bs-toggle="collapse" data-bs-target="#sitenavbar">
      <span class="icon-bar"></span>
      <span class="icon-bar"></span>
      <span class="icon-bar"></span>
    </button>

    <div class="collapse navbar-collapse" id="sitenavbar">
      <ul class="navbar-nav ms-auto main-nav">
        {{$menu := (.Site.Menus.nav)}}
        {{$len := (len $menu)}}
        {{ range $index, $element := $menu }}
        {{ if eq (add $index 1) $len }}
        <li class="nav-item">
          <a class="nav-link btn btn-sm btn-primary btn-sm-rounded" href="{{ .URL | relURL }}">
            {{ .Name }}
          </a>
        </li>
        {{ else }}
        <li class="nav-item">
          <a class="nav-link" href="{{ .URL | relURL }}">{{ .Name }}</a>
        </li>
        {{ end }}
        {{ end }}
      </ul>
    </div>
  </div>
</nav>
