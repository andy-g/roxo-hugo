<head>
  <meta charset="utf-8" />
  <title>{{ .Title }}</title>

  {{ "<!-- mobile responsive meta -->" | safeHTML }}
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1" />
  {{ with .Site.Params.author }}
  <meta name="author" content="{{ . }}">
  {{ end }}
  {{ hugo.Generator }}

  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
  {{ "<!-- Main Stylesheets -->" | safeHTML }}
  {{ $style := resources.Get "scss/style.scss" | css.Sass | minify }}
  <link href="{{ $style.Permalink | relURL }}" rel="stylesheet" />

  {{ range .Site.Params.custom_stylesheets -}}
  {{ $style := resources.Get . | css.Sass | minify }}
  <link href="{{ $style.Permalink | relURL }}" rel="stylesheet" />
  {{- end }}

  <!--Favicon-->
  <link rel="icon" href="{{ .Site.Params.favicon_icon | relURL }}" media="(prefers-color-scheme: light)" type="image/x-icon" />
  <link rel="icon" href="{{ .Site.Params.favicon_icon_dark | relURL }}" media="(prefers-color-scheme: dark)" type="image/x-icon" />
  <link rel="icon" href="{{ .Site.Params.favicon_svg | relURL }}" media="(prefers-color-scheme: light)" type="image/svg+xml">
</head>
